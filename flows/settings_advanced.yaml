# Tour avançado pelo app Configurações do Android (emulador em português do Brasil / pt-BR).
#
# Demonstração de recursos avançados do AndroFlow:
# - Rolagem e gestos (scroll e swipe)
# - Expressões regulares (regex: true)
# - Digitação com foco automático e transliteração (inputText + transliterate: true)
# - Edição de texto e teclado (eraseText e hideKeyboard)
# - Repetições (repeat) e tempos com unidades (sleep: "500ms")
# - Teclas de sistema (pressKey)
#
#   uv run androflow test flows/settings_advanced.yaml

appId: com.android.settings
---
# 1. Inicia o app limpo na tela inicial
- launchApp:
    stopApp: true

- assertVisible: "Rede e internet"
- takeScreenshot: "adv-01-topo"

# 2. Testa repetição de rolagem para alcançar o final da lista (repeat + scroll)
- repeat:
    times: 2
    commands:
      - scroll
      - sleep: "300ms"

- assertVisible:
    text: "Sobre o dispositivo emulado|Acessibilidade|Sistema|Bateria"
    regex: true

# 3. Testa gesto de swipe customizado (direcional)
- swipe:
    direction: DOWN
- sleep: "500ms"

# 4. Testa abertura de busca com foco automático e transliteração de acentos
- tapOn: "Pesquise configurações"
- waitFor:
    id: "open_search_view_edit_text"
    timeout: 5

- inputText:
    id: "open_search_view_edit_text"
    text: "conexão"
    transliterate: true

# Valida que o texto digitado virou "conexao" na tela
- assertVisible:
    id: "open_search_view_edit_text"
    text: "conexao"

# 5. Testa apagar texto digitado (eraseText) e digitar novo termo
- eraseText: 10
- inputText: "bateria"
- assertVisible:
    id: "open_search_view_edit_text"
    text: "bateria"
- takeScreenshot: "adv-02-busca"

# 6. Testa fechar o teclado virtual
- hideKeyboard
- sleep: "300ms"

# 7. Testa acionamento de tecla de sistema (pressKey) para sair da busca
- pressKey: Back
- waitFor:
    text: "Pesquise configurações"
    timeout: 5

# 8. Valida retorno à tela das configurações em português
- assertVisible: "Pesquise configurações"
- takeScreenshot: "adv-03-final"
