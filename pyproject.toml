[project]
name = "androflow"
version = "0.1.0"
description = "A small YAML-driven Android UI test runner powered by ADB."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
  { name = "Carlos Felipe Araujo", email = "carlosxfelipe@gmail.com" },
]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0.2",
  "typer>=0.12.5",
]

[project.scripts]
androflow = "androflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/androflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
